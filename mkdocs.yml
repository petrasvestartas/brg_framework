site_name: BRG framework
site_url: https://blockresearchgroup.github.io/brg_framework/

repo_name: BlockResearchGroup/brg_framework
repo_url: https://github.com/BlockResearchGroup/brg_framework

copyright: Copyright &copy; ETH Zurich - Block Research Group

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - toc:
      permalink: "¤"

plugins:
  - search

nav:
  - Getting Started:
      - Introduction: index.md
      - Installation: installation.md
      - License: license.md
      - Changelog: changelog.md
