[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# project info
# ============================================================================

[project]
name = "brg_framework"
description = "The Block Research Group packages, with the skill and MCP server for coding agents"
authors = [{ name = "Block Research Group - ETH Zurich" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "compas_framework>=0.1.3",
    "compas>=2.16",
    "compas_fd>=0.5.4",
    "compas_dr>=0.3.1",
    "compas_tna>=0.9.0",
    "compas_tno>=0.4.0",
    "compas_dem>=0.6.0",
    "compas_ags>=1.3.3",
    "compas_viewer>=2.0.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
brg = "brg_framework.cli:main"

[project.urls]
Repository = "https://github.com/BlockResearchGroup/brg_framework"
Changelog = "https://github.com/BlockResearchGroup/brg_framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/BlockResearchGroup/brg_framework/issues"

# ============================================================================
# build: the package, and the skill from skills/ inside it
# ============================================================================

[tool.hatch.version]
path = "src/brg_framework/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "LICENSE", "README.md", "CHANGELOG.md"]
exclude = ["__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/brg_framework"]
exclude = ["__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"skills/brg-methods" = "brg_framework/skills/brg-methods"

# ============================================================================
# checks
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 179
extend-exclude = ["server", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
isort = { force-single-line = true }
