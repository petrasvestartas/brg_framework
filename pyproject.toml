# One install for all Block Research Group packages, like compas_framework for COMPAS.
# It has no code of its own: it only lists the packages.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brg_framework"
version = "0.1.0"
description = "Installs the Block Research Group packages: compas_fd, compas_dr, compas_tna, compas_tno, compas_dem, compas_ags"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "compas>=2.16",
    "compas_fd>=0.5.4",
    "compas_dr>=0.3.1",
    "compas_tna>=0.9.0",
    "compas_tno>=0.4.0",
    "compas_dem>=0.6.0",
    "compas_ags>=1.3.3",
    "compas_viewer>=2.0.2",
]

[project.urls]
Repository = "https://github.com/BlockResearchGroup/brg_framework"

[tool.hatch.build.targets.wheel]
bypass-selection = true
